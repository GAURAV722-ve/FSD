<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Document</title>
    <style>
        h1 {
            color: green;
            text-align: center;
        }

        #p1 {
            color: blue;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- Inline css -->
    <h1 style="color: red; text-align: center;">Inline CSS Example</h1>

    <p style="color: yellowgreen; font-size: 20px;">
        This paragraph uses inline CSS.
    </p>

    <!-- Internal css -->
    <h1>Internal CSS Example</h1>

    <p id="p1">
        This paragraph uses internal CSS.
    </p>
    

    <!-- External css -->

    <h2>External CSS Example</h2>

    <p>
        This paragraph uses external CSS.
    </p>

</body>
</html>
