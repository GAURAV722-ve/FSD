<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Calculator</title>
    <!-- Link to External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-card">
        <h2>💰 Interest Calculator</h2>
        
        <!-- Input Fields -->
        <div class="form-group">
            <label>Interest Type</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="interestType" value="simple" checked id="type-simple"> Simple
                </label>
                <label class="radio-label">
                    <input type="radio" name="interestType" value="compound" id="type-compound"> Compound
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="principal">Principal Amount (₹)</label>
            <input type="number" id="principal" placeholder="e.g. 10000" min="0" step="any" required>
        </div>

        <div class="form-group">
            <label for="rate">Annual Interest Rate (%)</label>
            <input type="number" id="rate" placeholder="e.g. 5.5" min="0" step="0.01" required>
        </div>

        <div class="form-group">
            <label for="time">Time Period (Years)</label>
            <input type="number" id="time" placeholder="e.g. 3" min="0" step="any" required>
        </div>

        <div class="form-group" id="compound-row" class="hidden">
            <label for="compounding">Compounding Frequency</label>
            <select id="compounding">
                <option value="1">Annually (1/yr)</option>
                <option value="2">Semi-Annually (2/yr)</option>
                <option value="4">Quarterly (4/yr)</option>
                <option value="12" selected>Monthly (12/yr)</option>
                <option value="365">Daily (365/yr)</option>
            </select>
        </div>

        <button id="calculate-btn">Calculate Balance</button>

        <!-- Dynamic Results Screen -->
        <div class="results-box" id="results">
            <div class="result-row">
                <span>Principal Invested:</span>
                <span id="res-principal">₹0.00</span>
            </div>
            <div class="result-row">
                <span>Interest Earned:</span>
                <span id="res-interest">₹0.00</span>
            </div>
            <div class="result-row total">
                <span>Total Future Value:</span>
                <span id="res-total">₹0.00</span>
            </div>
        </div>
    </div>

    <!-- Link to External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
